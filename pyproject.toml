[project]
name = "oa-configurator"
version = "0.1.0"
description = "Prototype shared configuration layer for the OMOP-oriented stack."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "rich>=13,<15",
  "sqlalchemy>=2.0,<3",
  "tomli-w>=1,<2",
  "typer>=0.12,<1",
  "click>=8.0"
]

[project.optional-dependencies]
dev = [
  "ipython>=8.0",
  "requests>=2.33.0",
  "pytest>=9.0.3",
  "pytest-cov>=4.0",
  "mypy>=1.8",
  "ruff>=0.4",
  "mkdocs-material>=9.7.1",
  "mkdocstrings-python>=2.0.1",
  "mkdocs>=1.6.1",
  "mkdocs-mermaid2-plugin"
]

postgres = [
  "psycopg[binary]>=3.1",
]

[project.scripts]
omop-config = "oa_configurator.cli:app"

[project.entry-points.pytest11]
oa_configurator = "oa_configurator.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_configurator"]
