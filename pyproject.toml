[project]
name = "oa-configurator"
dynamic = ["version"]
description = "Shared configuration and database-resolution layer for the OMOP-oriented stack."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "rich>=13,<15",
  "sqlalchemy>=2.0,<3",
  "tomli-w>=1,<2",
  "typer>=0.12,<1",
  "click>=8.0"
]
license = { text = "Apache-2.0" }
authors = [
  { name = "Nico Loesch", email = "n.loesch@unsw.edu.au" },
  { name = "Georgie Kennedy", email = "georgie.kennedy@unsw.edu.au" }
]


[project.optional-dependencies]
dev = [
  "ipython>=8.0",
  "requests>=2.33.0",
  "pytest>=9.0.3",
  "pytest-cov>=4.0",
  "ty>=0.0.59",
  "ruff>=0.4",
  "mkdocs-material>=9.7.7",
  "mkdocstrings-python>=2.0.1",
  "mkdocs>=1.6.1",
  "mkdocs-mermaid2-plugin"
]

postgres = [
  "psycopg[binary]>=3.1",
]

[project.scripts]
omop-config = "oa_configurator.cli:app"

[project.entry-points.pytest11]
oa_configurator = "oa_configurator.testing"

[project.entry-points."omop.config"]
oa_configurator = "oa_configurator.config:OAConfiguratorConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/oa_configurator"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
