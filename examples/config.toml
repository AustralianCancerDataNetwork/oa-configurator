# ~/.config/omop/config.toml
# OMOP stack shared configuration, using the oa-configurator 1.0 schema.
#
# Manage with:   omop-config configure <package>
# Verify:        omop-config verify
# Export env:    omop-config export-env   (Docker Compose only)

# ---------------------------------------------------------------------------
# Connections: physical database endpoints.
# Restrict file permissions: chmod 600 ~/.config/omop/config.toml
# ---------------------------------------------------------------------------

[connections.local_cdm]
dialect       = "postgresql+psycopg"
host          = "localhost"
port          = 5432
user          = "omop"
password      = "omop"
database_name = "omop_cdm"

[connections.local_cdm_test]
dialect       = "postgresql+psycopg"
host          = "localhost"
port          = 5432
user          = "test"
password      = "test"
database_name = "test_db"
test_only     = true

[connections.prod_cdm]
dialect       = "postgresql+psycopg"
host          = "prod.hospital.org"
port          = 5432
user          = "omop_prod"
password      = "changeme"
database_name = "omop_cdm"

[connections.prod_emb]
dialect       = "postgresql+psycopg"
host          = "prod.hospital.org"
port          = 5432
user          = "omop_emb"
password      = "changeme"
database_name = "omop_emb"

# ---------------------------------------------------------------------------
# Databases: named logical targets built on connections.
# Every entry requires kind = "generic" or kind = "cdm".
# ---------------------------------------------------------------------------

[databases.cdm_db]
kind        = "cdm"
connection  = "local_cdm"
schema_name = "omop"

[databases.test_cdm_db]
kind        = "cdm"
connection  = "local_cdm_test"
schema_name = "public"

[databases.emb_db]
kind        = "generic"
connection  = "prod_emb"
schema_name = "public"

[databases.prod_cdm_db]
kind           = "cdm"
connection     = "prod_cdm"
schema_name    = "omop"
vocab_schema   = "vocab"
results_schema = "results"

# ---------------------------------------------------------------------------
# Providers and models: reusable LLM/embedding backends.
# ---------------------------------------------------------------------------

[providers.local-ollama]
provider = "ollama"
base_url = "http://ollama:11434"

[models.nomic-embed]
provider        = "local-ollama"
model           = "nomic-embed-text:v1.5"
embedding_dim   = 768
document_prefix = "search_document: "
query_prefix    = "search_query: "
embeddings      = true

[models.chat]
provider = "local-ollama"
model    = "mistral-small3.2"
tool_use = true

# ---------------------------------------------------------------------------
# Vector stores: embedding storage backed by a generic database.
# ---------------------------------------------------------------------------

[vector_stores.embedding_store]
backend_type = "pgvector"
database     = "emb_db"

# ---------------------------------------------------------------------------
# Tools: per-package config, managed via `omop-config configure <package>`.
# Fields are package-specific; each package defines its own typed schema.
# ---------------------------------------------------------------------------

[tools.omop_alchemy]
# athena_source_path = "/data/athena"   # path to Athena vocabulary CSVs

[tools.omop_emb]
cdm_db               = "cdm_db"
embedding_model_name = "nomic-embed"
vector_store_name    = "embedding_store"

[tools.omop_graph]
max_depth = 6
max_paths = 20

[tools.omop_spires]
model = "chat"

# ---------------------------------------------------------------------------
# Logging (optional): omit for WARNING-level defaults.
# ---------------------------------------------------------------------------

[logging]
level = "INFO"

[logging.loggers]
"sqlalchemy.engine" = "WARNING"
