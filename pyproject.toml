[project]
name = "oa-configurator"
version = "0.0.1"
description = "Prototype shared configuration layer for the OMOP-oriented stack."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "rich>=13,<15",
  "sqlalchemy>=2.0,<3",
  "tomli-w>=1,<2",
  "typer>=0.12,<1",
]

[project.scripts]
oa-config = "oa_configurator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_configurator"]
