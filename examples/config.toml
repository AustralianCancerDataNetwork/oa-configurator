# ~/.config/omop/config.toml 
# OMOP stack shared configuration
#
# Manage with:   omop-config configure <package>
# Verify:        omop-config verify
# Export env:    omop-config export-env   (Docker Compose only)

active_profile = "local"   # override at runtime: OA_ACTIVE_PROFILE=prod omop-config show

# ---------------------------------------------------------------------------
# Connections with one entry per physical database endpoint
# Restrict file permissions: chmod 600 ~/.config/omop/config.toml
# ---------------------------------------------------------------------------

[connections.local_cdm]
dialect  = "postgresql+psycopg"
host     = "localhost"
port     = 5432
user     = "omop"
password = "omop"
database = "omop_cdm"

[connections.prod_cdm]
dialect  = "postgresql+psycopg"
host     = "prod.hospital.org"
port     = 5432
user     = "omop_prod"
password = "changeme"
database = "omop_cdm"

[connections.prod_vocab]
dialect  = "postgresql+psycopg"
host     = "prod.hospital.org"
port     = 5432
user     = "omop_vocab"
password = "changeme"
database = "omop_vocab"

# ---------------------------------------------------------------------------
# Resources: map logical OMOP roles to connections and schema names
# ---------------------------------------------------------------------------

[resources.cdm_db]
primary_db     = "local_cdm"
cdm_schema     = "omop"
# vocab_db     = "local_cdm"   # omit to fall back to primary_db
# vocab_schema = "omop"        # omit to fall back to cdm_schema
# results_schema = "results"   # optional; used by Achilles / Atlas

# ---------------------------------------------------------------------------
# Tools: per-package config, managed via `omop-config configure <package>`
# ---------------------------------------------------------------------------

[tools.omop_alchemy]
default_resource = "cdm_db"

[tools.omop_alchemy.extra]
# athena_source_path = "/data/athena"   # path to Athena vocabulary CSVs

# ---------------------------------------------------------------------------
# Profiles: named overlays; activate with `omop-config use <profile>`
# Each entry fully replaces the base entry with the same name.
# Entries not listed here are inherited from the base config unchanged.
# ---------------------------------------------------------------------------

[profiles.local]
# empty: no overrides -> base connections/resources are used as-is

[profiles.prod.connections.local_cdm]
dialect  = "postgresql+psycopg"
host     = "prod.hospital.org"
port     = 5432
user     = "omop_prod"
password = "changeme"
database = "omop_cdm"

[profiles.prod.resources.cdm_db]
primary_db     = "prod_cdm"
vocab_db       = "prod_vocab"
cdm_schema     = "omop"
vocab_schema   = "vocab"
results_schema = "results"

# ---------------------------------------------------------------------------
# Resource aliases: let packages use semantic names independent of your
# resource naming convention. Alias targets must exist at the base level.
# ---------------------------------------------------------------------------

[resource_aliases]
# cdm_db = "my_production_cdm"   # uncomment if your resource is named differently

# ---------------------------------------------------------------------------
# Logging (optional): omit for WARNING-level defaults
# ---------------------------------------------------------------------------

[logging]
level = "INFO"

[logging.loggers]
"sqlalchemy.engine" = "WARNING"
